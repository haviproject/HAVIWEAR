<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MARCH OF HAVIWEAR — Oficjalny Sklep</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel (do uruchamiania JSX w przeglądarce) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    /* Ukrywanie paska przewijania dla koszyka */
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-[#060606] text-[#ece7e1]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- OBRAZKI (Ścieżki względne lub linki) ---
    // Upewnij się, że w folderze ze stroną masz folderassets z plikami ad-bg.png i koszulka.png
    const adBgImg = "./assets/ad-bg.png";
    const koszulkaImg = "./assets/koszulka.png";

    const PRODUCT = {
      id: "haviwear-tee",
      name: "KOSZULKA HAVIWEAR",
      sub: "Czarna grafika, biała baza, oversize unisex",
      price: 120,
      image: koszulkaImg,
      sizes: ["S", "M", "L", "XL", "XXL"],
    };

    const BLIK_PHONE = "+48 733 883 859";

    // --- INTEGRACJA IKON LUCIDE ---
    const createLucideIcon = (iconName) => ({ className = "h-5 w-5", ...props }) => {
      const ref = useRef(null);
      useEffect(() => {
        if (window.lucide && ref.current) {
          ref.current.innerHTML = `<i data-lucide="${iconName}" class="${className}"></i>`;
          window.lucide.createIcons();
        }
      }, [className, iconName]);
      return <span ref={ref} class="inline-flex items-center justify-center" {...props} />;
    };

    const ShoppingBag = createLucideIcon("shopping-bag");
    const X = createLucideIcon("x");
    const Trash2 = createLucideIcon("trash-2");
    const Minus = createLucideIcon("minus");
    const Plus = createLucideIcon("plus");
    const Truck = createLucideIcon("truck");
    const ArrowRight = createLucideIcon("arrow-right");
    const ArrowLeft = createLucideIcon("arrow-left");
    const CheckCircle2 = createLucideIcon("check-circle-2");
    const Loader2 = createLucideIcon("loader-2");
    const ShieldCheck = createLucideIcon("shield-check");
    const Flame = createLucideIcon("flame");
    const ArrowDown = createLucideIcon("arrow-down");

    // --- GŁÓWNA APLIKACJA SKLEPU ---
    function App() {
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [view, setView] = useState("cart");
      const [form, setForm] = useState({
        name: "", surname: "", email: "", phone: "", street: "", city: "", zip: "", blikConfirmed: false, notes: ""
      });
      const [sending, setSending] = useState(false);
      const [shopSize, setShopSize] = useState("L");
      const [shopQty, setShopQty] = useState(1);
      const [scrolled, setScrolled] = useState(false);

      useEffect(() => {
        const handleScroll = () => setScrolled(window.scrollY > 50);
        window.addEventListener("scroll", handleScroll);
        return () => window.removeEventListener("scroll", handleScroll);
      }, []);

      const addToCart = () => {
        setCart(prev => {
          const existing = prev.find(i => i.size === shopSize);
          if (existing) return prev.map(i => i.size === shopSize ? { ...i, qty: i.qty + shopQty } : i);
          return [...prev, { size: shopSize, qty: shopQty }];
        });
        setIsCartOpen(true);
      };

      const total = cart.reduce((acc, item) => acc + (item.qty * PRODUCT.price), 0);
      const shipping = total >= 200 || total === 0 ? 0 : 15;
      const grandTotal = total + shipping;
      const cartCount = cart.reduce((acc, item) => acc + item.qty, 0);

      const submitOrder = async (e) => {
        e.preventDefault();
        setSending(true);
        const orderDetails = cart.map(i => `${PRODUCT.name} (${i.size}) x${i.qty}`).join(", ");
        const payload = {
          ...form,
          Zamowienie: orderDetails,
          Suma: grandTotal + " zł",
          Metoda: "BLIK na telefon (+48 733 883 859)",
          _subject: `Nowe zamówienie HAVIWEAR - ${form.name} ${form.surname}`,
        };

        try {
          await fetch("https://formsubmit.co/ajax/haviwearshop@gmail.com", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          setView("success");
          setCart([]);
        } catch (err) {
          alert("Błąd wysyłki zamówienia.");
        } finally {
          setSending(false);
        }
      };

      return (
        <div className="min-h-screen bg-[#060606] text-[#ece7e1] font-sans selection:bg-[#c20e26] selection:text-white antialiased">
          
          {/* NAWIGACJA */}
          <nav className={`fixed top-0 inset-x-0 z-50 transition-all duration-300 ${scrolled ? "bg-black/80 backdrop-blur-md border-b border-white/10 py-3" : "bg-transparent py-5"}`}>
            <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
              <div className="flex items-center gap-3">
                <Flame className="text-[#ff2b3e] h-6 w-6" />
                <span className="font-bold tracking-tighter text-xl uppercase italic">HAVIWEAR</span>
              </div>
              <div className="flex items-center gap-6">
                <button onClick={() => setIsCartOpen(true)} className="relative group p-2">
                  <ShoppingBag className="h-6 w-6 group-hover:text-[#ff2b3e] transition-colors" />
                  {cartCount > 0 && (
                    <span className="absolute -top-1 -right-1 bg-[#ff2b3e] text-white text-[10px] font-bold h-5 w-5 rounded-full flex items-center justify-center animate-pulse">
                      {cartCount}
                    </span>
                  )}
                </button>
              </div>
            </div>
          </nav>

          {/* HERO */}
          <section className="relative h-screen flex items-center justify-center overflow-hidden">
            <img src={adBgImg} className="absolute inset-0 w-full h-full object-cover opacity-60" alt="bg" onError={(e) => e.target.style.display='none'} />
            <div className="absolute inset-0 bg-gradient-to-t from-[#060606] via-transparent to-transparent" />
            <div className="relative z-10 text-center px-6">
              <h1 className="text-7xl md:text-9xl font-black italic tracking-tighter leading-none mb-6">
                MARCH OF <br />
                <span className="text-transparent" style={{WebkitTextStroke: "2px #ece7e1"}}>HAVI</span>
                <span className="text-[#ff2b3e]">WEAR</span>
              </h1>
              <p className="text-lg md:text-xl text-white/70 max-w-2xl mx-auto mb-10 font-medium">
                Najwyższa jakość, ciężki klimat. Limitowany drop dostępny tylko teraz. 
                Koszulka HAVIWEAR - 120 PLN.
              </p>
              <a href="#sklep" className="inline-flex items-center gap-3 bg-[#c20e26] hover:bg-[#ff2b3e] text-white px-10 py-4 rounded-full font-bold uppercase tracking-widest transition-all hover:scale-105 hover:shadow-[0_0_40px_rgba(194,14,38,0.5)]">
                Kup teraz <ArrowRight className="h-5 w-5" />
              </a>
            </div>
            <div className="absolute bottom-10 left-1/2 -translate-x-1/2 animate-bounce">
              <ArrowDown className="text-white/30 h-8 w-8" />
            </div>
          </section>

          {/* SKLEP */}
          <section id="sklep" className="py-24 px-6 max-w-7xl mx-auto">
            <div className="grid md:grid-cols-2 gap-16 items-center">
              <div className="relative aspect-square bg-[#111] rounded-3xl overflow-hidden border border-white/5 group flex items-center justify-center">
                <div className="absolute inset-0 bg-[#ff2b3e]/5 blur-3xl group-hover:bg-[#ff2b3e]/10 transition-all" />
                <img src={koszulkaImg} alt="Koszulka" className="relative z-10 w-full h-full object-contain p-12 transition-transform duration-700 group-hover:scale-110" />
              </div>

              <div>
                <span className="text-[#ff2b3e] font-bold tracking-[0.3em] uppercase text-sm mb-4 block">Bestseller</span>
                <h2 className="text-5xl font-black italic mb-2 uppercase">{PRODUCT.name}</h2>
                <p className="text-white/50 mb-8 text-lg">{PRODUCT.sub}</p>
                
                <div className="text-5xl font-black text-[#ff2b3e] mb-10 italic">
                  120 <span className="text-2xl text-white/40 not-italic uppercase">PLN</span>
                </div>

                <div className="mb-8">
                  <label className="block text-[10px] tracking-[0.2em] text-white/40 uppercase font-bold mb-4 text-left">Wybierz rozmiar</label>
                  <div className="flex flex-wrap gap-3">
                    {PRODUCT.sizes.map(s => (
                      <button 
                        key={s} 
                        onClick={() => setShopSize(s)}
                        className={`h-14 w-16 rounded-xl border-2 font-bold transition-all ${shopSize === s ? "border-[#ff2b3e] bg-[#ff2b3e] text-white shadow-[0_0_20px_rgba(194,14,38,0.4)]" : "border-white/10 hover:border-white/30"}`}
                      >
                        {s}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="flex gap-4 mb-10">
                  <div className="flex items-center bg-white/5 rounded-xl border border-white/10">
                    <button onClick={() => setShopQty(q => Math.max(1, q-1))} className="px-5 py-4 hover:text-[#ff2b3e] transition-colors"><Minus className="h-5 w-5"/></button>
                    <span className="w-10 text-center font-bold text-xl">{shopQty}</span>
                    <button onClick={() => setShopQty(q => q+1)} className="px-5 py-4 hover:text-[#ff2b3e] transition-colors"><Plus className="h-5 w-5"/></button>
                  </div>
                  <button 
                    onClick={addToCart}
                    className="flex-1 bg-white text-black font-black uppercase tracking-widest rounded-xl hover:bg-[#ff2b3e] hover:text-white transition-all flex items-center justify-center gap-3 py-4"
                  >
                    Dodaj do koszyka <ShoppingBag className="h-5 w-5" />
                  </button>
                </div>

                <div className="grid grid-cols-2 gap-4">
                  <div className="p-4 bg-white/5 rounded-2xl border border-white/5">
                    <Truck className="text-[#ff2b3e] h-6 w-6 mb-2" />
                    <div className="font-bold text-sm">Szybka wysyłka</div>
                    <div className="text-[10px] text-white/40">24h z magazynu w Polsce</div>
                  </div>
                  <div className="p-4 bg-white/5 rounded-2xl border border-white/5">
                    <ShieldCheck className="text-[#ff2b3e] h-6 w-6 mb-2" />
                    <div className="font-bold text-sm">Jakość Premium</div>
                    <div className="text-[10px] text-white/40">100% Bawełna Czesana</div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* STOPKA */}
          <footer className="bg-black py-20 px-6 border-t border-white/5 text-center">
            <div className="max-w-7xl mx-auto">
              <div className="flex justify-center items-center gap-4 mb-10">
                <Flame className="text-[#ff2b3e] h-10 w-10" />
                <span className="text-4xl font-black italic tracking-tighter uppercase">HAVIWEAR</span>
              </div>
              <p className="text-white/30 mb-10 uppercase tracking-[0.2em] text-xs">Produkcja w Polsce • Wysyłka na cały świat</p>
              <div className="flex justify-center gap-8 text-white/40 uppercase font-bold text-xs tracking-widest">
                <a href="#" className="hover:text-white transition-colors">Instagram</a>
                <a href="#" className="hover:text-white transition-colors">TikTok</a>
                <a href="mailto:haviwearshop@gmail.com" className="hover:text-white transition-colors">Kontakt</a>
              </div>
              <div className="mt-20 pt-10 border-t border-white/5 text-[10px] text-white/20 uppercase tracking-widest">
                © {new Date().getFullYear()} HAVIWEAR. Wszystkie prawa zastrzeżone.
              </div>
            </div>
          </footer>

          {/* KOSZYK / CHECKOUT DRAWER */}
          <div className={`fixed inset-0 z-[100] ${isCartOpen ? "pointer-events-auto" : "pointer-events-none"}`}>
            <div 
              onClick={() => setIsCartOpen(false)} 
              className={`absolute inset-0 bg-black/80 backdrop-blur-sm transition-opacity duration-500 ${isCartOpen ? "opacity-100" : "opacity-0"}`} 
            />
            <div className={`absolute top-0 right-0 h-full w-full max-w-md bg-[#0e0d0d] border-l border-white/10 shadow-2xl transition-transform duration-500 flex flex-col ${isCartOpen ? "translate-x-0" : "translate-x-full"}`}>
              
              {/* Header */}
              <div className="p-6 border-b border-white/10 flex justify-between items-center bg-black/20">
                <div>
                  <h3 className="font-black italic text-2xl uppercase">
                    {view === "success" ? "Sukces!" : view === "checkout" ? "Zamówienie" : "Koszyk"}
                  </h3>
                </div>
                <button onClick={() => setIsCartOpen(false)} className="p-2 hover:bg-white/5 rounded-full transition-colors"><X/></button>
              </div>

              {/* Content */}
              <div className="flex-1 overflow-y-auto p-6 scrollbar-hide">
                {view === "cart" && (
                  <>
                    {cart.length === 0 ? (
                      <div className="h-full flex flex-col items-center justify-center opacity-30 my-20">
                        <ShoppingBag className="h-20 w-20 mb-4" />
                        <p className="uppercase font-bold tracking-widest">Koszyk jest pusty</p>
                      </div>
                    ) : (
                      <div className="space-y-6">
                        {cart.map((item, idx) => (
                          <div key={idx} className="flex gap-4 p-4 bg-white/5 rounded-2xl border border-white/5">
                            <img src={PRODUCT.image} className="w-20 h-24 object-contain bg-black rounded-lg" alt="shirt" />
                            <div className="flex-1">
                              <div className="flex justify-between font-bold uppercase italic text-sm mb-1">
                                <span>{PRODUCT.name}</span>
                                <button onClick={() => setCart(prev => prev.filter((_, i) => i !== idx))} className="text-white/20 hover:text-[#ff2b3e]"><Trash2 className="h-4 w-4"/></button>
                              </div>
                              <div className="text-xs text-[#ff2b3e] font-bold mb-4 uppercase">Rozmiar: {item.size}</div>
                              <div className="flex justify-between items-center">
                                <div className="flex items-center gap-3 bg-black/40 rounded-lg px-2">
                                  <button onClick={() => setCart(prev => prev.map((it, i) => i === idx ? {...it, qty: Math.max(1, it.qty-1)} : it))} className="p-1"><Minus className="h-3 w-3"/></button>
                                  <span className="font-bold text-sm">{item.qty}</span>
                                  <button onClick={() => setCart(prev => prev.map((it, i) => i === idx ? {...it, qty: it.qty+1} : it))} className="p-1"><Plus className="h-3 w-3"/></button>
                                </div>
                                <span className="font-bold italic">{item.qty * PRODUCT.price} PLN</span>
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </>
                )}

                {view === "checkout" && (
                  <form id="orderForm" onSubmit={submitOrder} className="space-y-6">
                    <button type="button" onClick={() => setView("cart")} className="flex items-center gap-2 text-white/40 hover:text-white text-xs uppercase font-bold tracking-widest mb-6">
                      <ArrowLeft className="h-4 w-4" /> Powrót do koszyka
                    </button>
                    
                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="block text-[10px] text-white/40 uppercase font-bold mb-2">Imię</label>
                        <input required className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:border-[#ff2b3e] outline-none" placeholder="Jan" value={form.name} onChange={e => setForm({...form, name: e.target.value})} />
                      </div>
                      <div>
                        <label className="block text-[10px] text-white/40 uppercase font-bold mb-2">Nazwisko</label>
                        <input required className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:border-[#ff2b3e] outline-none" placeholder="Kowalski" value={form.surname} onChange={e => setForm({...form, surname: e.target.value})} />
                      </div>
                    </div>

                    <div>
                      <label className="block text-[10px] text-white/40 uppercase font-bold mb-2">E-mail</label>
                      <input required type="email" className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:border-[#ff2b3e] outline-none" placeholder="twoj@email.pl" value={form.email} onChange={e => setForm({...form, email: e.target.value})} />
                    </div>

                    <div>
                      <label className="block text-[10px] text-white/40 uppercase font-bold mb-2">Telefon</label>
                      <input required className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:border-[#ff2b3e] outline-none" placeholder="123 456 789" value={form.phone} onChange={e => setForm({...form, phone: e.target.value})} />
                    </div>

                    <div>
                      <label className="block text-[10px] text-white/40 uppercase font-bold mb-2">Ulica i nr</label>
                      <input required className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:border-[#ff2b3e] outline-none" placeholder="ul. Przykładowa 1/2" value={form.street} onChange={e => setForm({...form, street: e.target.value})} />
                    </div>

                    <div className="grid grid-cols-[1fr_auto] gap-4">
                      <div>
                        <label className="block text-[10px] text-white/40 uppercase font-bold mb-2">Miasto</label>
                        <input required className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:border-[#ff2b3e] outline-none" placeholder="Warszawa" value={form.city} onChange={e => setForm({...form, city: e.target.value})} />
                      </div>
                      <div className="w-24">
                        <label className="block text-[10px] text-white/40 uppercase font-bold mb-2">Kod</label>
                        <input required className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:border-[#ff2b3e] outline-none" placeholder="00-001" value={form.zip} onChange={e => setForm({...form, zip: e.target.value})} />
                      </div>
                    </div>

                    <div className="p-4 bg-[#ff2b3e]/5 border border-[#ff2b3e]/20 rounded-2xl">
                      <div className="flex items-center gap-3 mb-4">
                        <div className="bg-[#ff2b3e] text-white font-black px-2 py-1 rounded text-[10px]">BLIK</div>
                        <div className="text-xs font-bold uppercase italic">Przelew na telefon</div>
                      </div>
                      <div className="text-center py-4 bg-black/40 rounded-xl border border-white/5 mb-4">
                        <div className="text-[10px] text-white/30 uppercase font-bold mb-1">Numer Revolut</div>
                        <div className="text-xl font-mono font-black text-white">{BLIK_PHONE}</div>
                        <div className="text-[10px] text-[#ff2b3e] font-bold mt-2 uppercase italic tracking-widest">Suma: {grandTotal} PLN</div>
                      </div>
                      <label className="flex items-start gap-3 cursor-pointer group">
                        <input required type="checkbox" className="mt-1 h-4 w-4 accent-[#ff2b3e]" checked={form.blikConfirmed} onChange={e => setForm({...form, blikConfirmed: e.target.checked})} />
                        <span className="text-[10px] text-white/60 leading-tight uppercase font-bold">Potwierdzam, że wysłałem {grandTotal} PLN BLIKiem na podany numer.</span>
                      </label>
                    </div>
                  </form>
                )}

                {view === "success" && (
                  <div className="h-full flex flex-col items-center justify-center text-center my-12">
                    <div className="h-20 w-20 bg-emerald-500 rounded-full flex items-center justify-center mb-6 shadow-[0_0_40px_rgba(16,185,129,0.3)] animate-bounce">
                      <CheckCircle2 className="h-10 w-10 text-white" />
                    </div>
                    <h4 className="text-3xl font-black uppercase italic mb-4">Przyjęto!</h4>
                    <p className="text-white/50 text-sm mb-8">Twoje zamówienie trafiło do realizacji. <br/> Wyślemy potwierdzenie na maila.</p>
                    <button onClick={() => { setIsCartOpen(false); setView("cart"); }} className="w-full py-4 bg-white text-black font-black uppercase tracking-widest rounded-xl">Wróć do sklepu</button>
                  </div>
                )}
              </div>

              {/* Footer */}
              {cart.length > 0 && view !== "success" && (
                <div className="p-6 border-t border-white/10 bg-black/40">
                  <div className="space-y-2 mb-6 text-sm">
                    <div className="flex justify-between text-white/40 uppercase font-bold text-[10px] tracking-widest"><span>Produkty</span><span>{total} PLN</span></div>
                    <div className="flex justify-between text-white/40 uppercase font-bold text-[10px] tracking-widest"><span>Dostawa</span><span>{shipping === 0 ? "Gratis" : shipping + " PLN"}</span></div>
                    <div className="flex justify-between text-xl font-black italic uppercase pt-2 border-t border-white/5"><span>Suma</span><span className="text-[#ff2b3e]">{grandTotal} PLN</span></div>
                  </div>
                  
                  {view === "cart" ? (
                    <button onClick={() => setView("checkout")} className="w-full py-4 bg-[#c20e26] hover:bg-[#ff2b3e] text-white font-black uppercase tracking-widest rounded-xl transition-all flex items-center justify-center gap-3">
                      Przejdź do kasy <ArrowRight className="h-5 w-5" />
                    </button>
                  ) : (
                    <button 
                      form="orderForm"
                      type="submit"
                      disabled={sending}
                      className="w-full py-4 bg-[#c20e26] hover:bg-[#ff2b3e] text-white font-black uppercase tracking-widest rounded-xl transition-all flex items-center justify-center gap-3 disabled:opacity-50"
                    >
                      {sending ? <Loader2 className="animate-spin" /> : "Zamawiam i płacę"}
                    </button>
                  )}
                </div>
              )}
            </div>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
